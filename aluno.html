<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Meus resultados · Ateliê de Provas</title><link rel="stylesheet" href="style.css"><body><main style="max-width:850px;margin:2rem auto;padding:1rem"><section class="card"><h1>Meus resultados</h1><p>Consulte as avaliações liberadas pelo professor.</p><form id="login"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">Entrar</button><button type="button" id="recover">Recuperar senha</button></form><form id="reset" hidden><label>Nova senha (mínimo de 12 caracteres)<input id="newpassword" type="password" minlength="12" autocomplete="new-password" required></label><button>Salvar senha</button></form><button id="exit" hidden>Sair</button><p id="status" role="status" aria-live="polite"></p><div id="results"></div></section></main><script type="module" src="aluno.js"></script></body></html>
